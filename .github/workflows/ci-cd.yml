name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: joura
          POSTGRES_USER: joura
          POSTGRES_PASSWORD: joura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joura -d joura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Joura.sln

      - name: Check formatting
        run: dotnet format Joura.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Joura.sln --configuration Release --no-restore

      - name: Install Playwright browser
        run: pwsh tests/Joura.UiTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        env:
          CI: "true"
          JOURA_UI_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=joura;Password=joura
        run: >-
          dotnet test tests/Joura.UiTests/Joura.UiTests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults
          --logger "trx;LogFileName=joura-ui-tests.trx"

      - name: Upload test results
        if: always() && hashFiles('TestResults/**/*.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults
          if-no-files-found: error
          retention-days: 7

      - name: Publish application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/Joura.Web/Joura.Web.csproj --configuration Release --no-restore --output publish

      - name: Upload application artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: joura-web-${{ github.sha }}
          path: publish
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: joura-web-${{ github.sha }}
          path: publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
